[project]
name = "hermes-acp-relay"
version = "0.2.0"
description = "aiohttp WebSocket server exposing Hermes ACP for network access"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    # Keep ACP as a direct dependency because the relay imports it, but let the
    # pinned hermes-agent[acp] extra own the exact compatible SDK version.
    "agent-client-protocol",
    "hermes-agent[acp]",
]

[project.scripts]
hermes-acp-relay = "hermes_acp_relay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
