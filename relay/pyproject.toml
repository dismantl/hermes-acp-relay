[project]
name = "hermes-acp-relay"
version = "0.1.0"
description = "aiohttp WebSocket server exposing Hermes ACP for network access"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    # Pin explicitly so it stays in lockstep with the voice-agent client
    # (voice-agent pins the same range). hermes-agent's transitive constraint
    # is wider; without this override an image rebuild could resolve 0.10.x
    # while voice-agent stays on 0.9.x and the wire protocol diverges.
    "agent-client-protocol>=0.9.0,<0.10",
    "hermes-agent[acp]",
]

[project.scripts]
hermes-acp-relay = "hermes_acp_relay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
