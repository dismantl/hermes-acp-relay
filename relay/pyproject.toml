[project]
name = "hermes-acp-relay"
version = "0.2.0"
description = "aiohttp WebSocket server exposing Hermes ACP for network access"
requires-python = ">=3.11"
# hermes-agent is not a declared dependency: upstream refuses to build it as a
# wheel, so the relay is installed with --no-deps into the hermes-agent image,
# which also supplies the ACP SDK version this relay must match.
dependencies = [
    "aiohttp>=3.9",
    "agent-client-protocol",
]

[project.scripts]
hermes-acp-relay = "hermes_acp_relay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
