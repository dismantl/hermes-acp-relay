[project]
name = "hermes-acp-relay"
version = "0.1.0"
description = "aiohttp WebSocket server exposing Hermes ACP for network access"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    # Pin explicitly so ACP clients and the relay stay on the same wire
    # protocol range. hermes-agent's transitive constraint is wider; without
    # this override a rebuild could resolve an incompatible 0.10.x release.
    "agent-client-protocol>=0.9.0,<0.10",
    "hermes-agent[acp]",
]

[project.scripts]
hermes-acp-relay = "hermes_acp_relay.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
