[project]
name = "hermes-acp-relay-workspace"
version = "0.1.0"
description = "WebSocket relay + stdio bridge for Hermes ACP"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["relay", "bridge"]

[tool.uv.sources]
hermes-agent = { git = "https://github.com/NousResearch/hermes-agent.git", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
