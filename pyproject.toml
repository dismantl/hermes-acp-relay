[project]
name = "hermes-acp-relay-workspace"
version = "0.1.0"
description = "WebSocket relay + stdio bridge for Hermes ACP"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["relay", "bridge"]

[tool.uv.sources]
# hermes-agent is pinned to a specific, tested revision rather than a moving
# branch. The relay imports and subclasses hermes-agent internals
# (`acp_adapter.server.HermesACPAgent`) and monkeypatches
# `hermes_constants.get_hermes_home`, so an unvetted upstream bump can break the
# relay. Bump this rev deliberately in a PR so CI exercises the internals
# against the new version before it lands (see
# tests/test_hermes_internals_smoke.py).
hermes-agent = { git = "https://github.com/NousResearch/hermes-agent.git", rev = "3ef6bbd201263d354fd83ec55b3c306ded2eb72a" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
