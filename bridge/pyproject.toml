[project]
name = "hermes-acp-bridge"
version = "0.1.0"
description = "stdio <-> WebSocket bridge for Hermes ACP relay (client side)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[project.scripts]
hermes-acp-bridge = "hermes_acp_bridge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
