name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Keep equal to the digest in .forgejo/workflows/ci.yml.
      image: nousresearch/hermes-agent@sha256:667a9dc77f303f6cd6e9ff62ce2c9580563597e09dde07fe5a224375988d6209
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests against the image's hermes-agent
        run: sh scripts/ci-test.sh
