name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Keep equal to the digest in .forgejo/workflows/ci.yml.
      image: nousresearch/hermes-agent@sha256:41468459379a943cf0a25a55589e230d244bd9f95b83cff5eca789470c892fac
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests against the image's hermes-agent
        run: sh scripts/ci-test.sh
