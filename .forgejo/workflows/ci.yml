name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      # The hermes-agent image production builds the relay on. acab-ansible's
      # Hermes promotion moves this digest; keep it equal to the one in
      # .github/workflows/ci.yml.
      image: nousresearch/hermes-agent@sha256:667a9dc77f303f6cd6e9ff62ce2c9580563597e09dde07fe5a224375988d6209
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: Run tests against the image's hermes-agent
        run: sh scripts/ci-test.sh
